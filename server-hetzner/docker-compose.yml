services:
  presets-api:
    build: .
    container_name: motorvisuales-presets-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - presets-data:/app/data

  # Reverse proxy Caddy opcional para SSL automático con Let's Encrypt
