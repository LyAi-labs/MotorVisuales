version: '3.8'

services:
  motorvisuales:
    build: .
    container_name: motorvisuales
    restart: unless-stopped
    ports:
      - "8088:8000"
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.motorvisuales.rule=Host(`motorvisuales.site`) || Host(`www.motorvisuales.site`)"
      - "traefik.http.routers.motorvisuales.entrypoints=websecure"
      - "traefik.http.routers.motorvisuales.tls.certresolver=letsencrypt"
      - "traefik.http.services.motorvisuales.loadbalancer.server.port=8000"

networks:
  traefik_public:
    external: true
